name: Daily arena run

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, after both London and New York have closed
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run even if today's date was already processed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: arena
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the arena
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m arena.run ${{ inputs.force && '--force' || '' }}

      - name: Commit results
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet || git commit -m "Arena day $(date -u +%F)"
          git push
